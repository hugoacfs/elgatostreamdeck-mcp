[project]
name = "streamdeck-mcp"
version = "0.4.0"
description = "MCP server for Stream Deck profile writing: stdio server plus an authenticated streamable-HTTP service for remote agents"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Hugo Soares"}
]
requires-python = ">=3.11"
keywords = ["mcp", "streamdeck", "elgato", "profiles", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Pinned to the 1.x line: mcp 2.x renamed FastMCP to MCPServer and
    # removed the lowlevel Server decorator API this codebase uses.
    "mcp[cli]>=1.25.0,<2.0.0",
    "streamdeck>=0.9.0",
    "pillow>=10.0.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
streamdeck-mcp = "profile_server:run"
streamdeck-mcp-usb = "server:run"
streamdeck-mcp-service = "http_service:main"
streamdeck-mcp-install-skill = "install_skill:main"

[project.urls]
Homepage = "https://github.com/hugoacfs/elgatostreamdeck-mcp"
Repository = "https://github.com/hugoacfs/elgatostreamdeck-mcp"
Issues = "https://github.com/hugoacfs/elgatostreamdeck-mcp/issues"
"Forked From" = "https://github.com/verygoodplugins/streamdeck-mcp"

[tool.mcp]
name = "io.github.hugoacfs/elgatostreamdeck-mcp"

[tool.setuptools]
py-modules = ["profile_manager", "profile_server", "server", "mdi_icons", "install_skill", "http_service"]
packages = ["streamdeck_assets", "streamdeck_plugin"]

[tool.setuptools.package-data]
streamdeck_assets = [
    "*.ttf",
    "*.json",
    "MDI-LICENSE",
    "skill/streamdeck-designer/SKILL.md",
    "skill/streamdeck-designer/references/*.md",
    "skill/streamdeck-designer/assets/*.txt",
    "skill/streamdeck-designer/assets/recipes/*.json",
]
streamdeck_plugin = [
    "io.github.verygoodplugins.streamdeck-mcp.sdPlugin/manifest.json",
    "io.github.verygoodplugins.streamdeck-mcp.sdPlugin/plugin.html",
    "io.github.verygoodplugins.streamdeck-mcp.sdPlugin/plugin.js",
    "io.github.verygoodplugins.streamdeck-mcp.sdPlugin/Images/*.png",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
